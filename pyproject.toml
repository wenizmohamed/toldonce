[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toldonce"
version = "0.2.0"
description = "Tell your coding agent once: corrections become lessons in a Relate graph."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["relate-db>=1.0.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
toldonce = "toldonce.cli:main"
toldonce-mcp = "toldonce.mcp:main"

[tool.setuptools]
packages = ["toldonce"]

[tool.setuptools.package-data]
toldonce = ["recall.cypher"]
